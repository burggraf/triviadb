[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triviadb"
version = "0.1.0"
description = "Resumable, fact-first, openly licensed pub trivia generation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
triviadb = "triviadb.__main__:main"

[tool.setuptools.packages.find]
include = ["triviadb*"]
